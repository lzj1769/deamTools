site_name: DeamTools
site_description: A Python toolkit for deaminase-based chromatin accessibility analysis
site_url: https://lzj1769.github.io/deamTools
repo_url: https://github.com/lzj1769/deamTools
repo_name: lzj1769/deamTools

# Read the Docs look (Sphinx-RTD-style), matching the classic readthedocs.io theme.
theme:
  name: readthedocs
  highlightjs: true
  navigation_depth: 2
  collapse_navigation: false
  sticky_navigation: true
  prev_next_buttons_location: bottom

markdown_extensions:
  - admonition
  - fenced_code
  - tables
  - toc:
      permalink: true

nav:
  - Introduction: index.md
  - Installation: installation.md
  - Commands:
      - index: usage/index.md
      - align: usage/align.md
      - bam2bw: usage/bam2bw.md
      - bam2fragment: usage/bam2fragment.md
      - qc: usage/qc.md
      - plot_motif: usage/plot_motif.md
  - Algorithm: algorithm.md
  - API reference: api.md
