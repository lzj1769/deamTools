site_name: DeamTools
site_description: A Python toolkit for deaminase-based chromatin accessibility analysis
site_url: https://lzj1769.github.io/deamTools
repo_url: https://github.com/lzj1769/deamTools
repo_name: lzj1769/deamTools

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Usage:
      - bam2bw: usage/bam2bw.md
  - Algorithm: algorithm.md
  - API Reference: api.md
