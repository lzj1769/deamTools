name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    env:
      # uv reads this for both `sync` and `run`, so the matrix version is used
      # without repeating --python on every step.
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install system libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q zlib1g-dev libbz2-dev liblzma-dev libcurl4-openssl-dev

      # --locked fails if uv.lock is out of date with pyproject.toml, so a
      # dependency change that was not re-locked is caught here rather than
      # silently resolving to something else.
      - name: Install package
        run: uv sync --extra dev --locked

      - name: Run tests
        run: uv run pytest --tb=short

  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest

    # One version is enough: none of these three depend on the interpreter.
    # mypy in particular reads python_version from pyproject.toml, so it checks
    # against the same target whatever runs it.
    env:
      UV_PYTHON: "3.12"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install system libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q zlib1g-dev libbz2-dev liblzma-dev libcurl4-openssl-dev

      - name: Install package
        run: uv sync --extra dev --locked

      # Each step runs even if an earlier one failed, so a single push reports
      # every problem at once instead of one per round trip.
      - name: ruff
        if: '!cancelled()'
        run: uv run ruff check src/ tests/

      - name: black
        if: '!cancelled()'
        run: uv run black --check src/ tests/

      - name: mypy
        if: '!cancelled()'
        run: uv run mypy src/
