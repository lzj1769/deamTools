[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "deamtools"
version = "0.1.3"
description = "A Python command-line toolkit for deamination-based chromatin signal analysis."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Zhijian Li" }
]
keywords = [
  "genomics",
  "epigenomics",
  "chromatin",
  "accessibility",
  "deamination",
  "footprinting",
  "bioinformatics",
  "command-line",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Environment :: Console",
  "Operating System :: OS Independent",
]

dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "logomaker>=0.8",
  "pysam>=0.22",
  "pyBigWig>=0.3.22",
  "motifmatchpy>=1.0",
]

[project.optional-dependencies]
seq2edit = [
  "torch>=2.0",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5.0",
  "black>=24.0",
  "mypy>=1.10",
]
docs = [
  "sphinx>=7",
  "myst-parser>=2",
  "sphinx-rtd-theme>=2",
]

[project.scripts]
deamtools = "deamtools.cli.main:main"

[project.urls]
Homepage = "https://github.com/lzj1769/deamTools"
Repository = "https://github.com/lzj1769/deamTools"
Issues = "https://github.com/lzj1769/deamTools/issues"
Documentation = "https://lzj1769.github.io/deamTools"

[tool.hatch.build.targets.wheel]
packages = ["src/deamtools"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# black owns line length, and it does not split string literals. E501 therefore
# only ever fires on long help text and docstrings that black deliberately
# leaves alone, so keeping it enabled means permanent errors nobody can act on.
# Run black to enforce the limit on everything else.
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
